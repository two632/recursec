[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursec"
version = "1.0.0"
description = "Recursive Multi-Agent Security Framework — 16 local LLMs, 244+ security tools, autonomous vulnerability discovery"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [{name = "RecurSec"}]
keywords = ["security", "agent", "llm", "pentesting", "vulnerability", "multi-agent", "recursive"]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "aiofiles>=24.1",
    "asyncio-pool>=0.6",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "orjson>=3.10",
    "structlog>=24.1",
    "tenacity>=8.2",
    "redis>=5.0",
    "aiosqlite>=0.20",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "psutil>=6.0",
    "docker>=7.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6"]
sglang = ["sglang>=0.3"]
litellm = ["litellm>=1.40"]
all = ["recursec[vllm,sglang,litellm]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
recursec = "recursec.cli.main:main"

[tool.setuptools.packages.find]
include = ["recursec*"]

[tool.ruff]
target-version = "py311"
line-length = 120
