# ╔══════════════════════════════════════════════════════════════════╗
# ║              RecurSec Configuration                              ║
# ║  Recursive Multi-Agent Security Framework                        ║
# ║  Fully configurable — add as many models, tools, agents as you   ║
# ║  want. No limits.                                                ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── LLM Models ──────────────────────────────────────────────────────
# Add unlimited models. Each model can be assigned to specific task types.
# Backends: vllm, llama_cpp, sglang, litellm, ollama, openai_compatible
#
# Task types determine which model gets used for what:
#   - general: Default fallback
#   - code: Code analysis, exploit development, code auditing
#   - reasoning: Complex planning, decision making, analysis
#   - security: Vulnerability analysis, pentesting decisions
#   - writing: Report generation, documentation
#   - fast: Quick responses, simple queries (use smallest model)
#
# Priority: 1 = highest priority (used first), 10 = lowest
# Weight: Higher weight = more likely to be selected among same-priority models

models:
  # Example: vLLM serving DeepSeek Coder (best for code analysis)
  - name: deepseek-coder
    backend: vllm
    model_id: deepseek-ai/deepseek-coder-v2-lite-instruct
    base_url: http://localhost:8000
    task_types: [code, security]
    priority: 1
    max_concurrent: 10
    weight: 1.0

  # Example: vLLM serving Qwen (best for reasoning)
  - name: qwen-reasoning
    backend: vllm
    model_id: Qwen/Qwen2.5-72B-Instruct
    base_url: http://localhost:8001
    task_types: [reasoning, general]
    priority: 2
    max_concurrent: 5
    weight: 1.0

  # Example: llama.cpp serving Llama 3.1 (CPU-friendly, writing)
  - name: llama-writer
    backend: llama_cpp
    model_id: llama-3.1-70b-instruct
    base_url: http://localhost:8080
    task_types: [writing, general]
    priority: 3
    max_concurrent: 3
    weight: 0.8

  # Example: SGLang for fast multi-turn (lowest latency)
  - name: mistral-fast
    backend: sglang
    model_id: mistralai/Mistral-7B-Instruct-v0.3
    base_url: http://localhost:30000
    task_types: [fast, general]
    priority: 4
    max_concurrent: 20
    weight: 0.5

  # Example: LiteLLM proxy (routes to multiple backends)
  # - name: litellm-proxy
  #   backend: litellm
  #   model_id: gpt-4o  # or any model configured in LiteLLM
  #   base_url: http://localhost:4000
  #   api_key: sk-your-litellm-key
  #   task_types: [general]
  #   priority: 10

  # ── ADD MORE MODELS HERE ──
  # You can add as many as you want. No limit.
  # Each model runs on its own inference server.
  #
  # More examples:
  # - name: codellama-34b
  #   backend: vllm
  #   model_id: codellama/CodeLlama-34b-Instruct-hf
  #   base_url: http://localhost:8002
  #   task_types: [code]
  #   priority: 2
  #
  # - name: phi-3-mini
  #   backend: llama_cpp
  #   model_id: phi-3-mini-4k-instruct
  #   base_url: http://localhost:8081
  #   task_types: [fast]
  #   priority: 5
  #
  # - name: yi-34b
  #   backend: vllm
  #   model_id: 01-ai/Yi-34B-Chat
  #   base_url: http://localhost:8003
  #   task_types: [reasoning, general]
  #   priority: 3

# ── Agent Settings ──────────────────────────────────────────────────
agent:
  max_steps: 50          # Max steps per agent before forced completion
  max_depth: 5           # Max recursion depth (agents spawning agents)
  temperature: 0.3       # LLM temperature (lower = more deterministic)
  max_tokens: 4096       # Max response tokens per LLM call
  human_approval_required: false  # Set true for exploit validation gates

# ── Daemon Mode (24/7) ──────────────────────────────────────────────
daemon:
  enabled: true
  poll_interval_s: 60      # How often to check for new tasks
  max_concurrent_tasks: 5  # Tasks running simultaneously
  auto_restart: true       # Restart failed tasks

  # Scheduled recurring scans
  schedule:
    # Example: Scan internal network every 6 hours
    # - objective: "Full vulnerability assessment of internal network"
    #   target: "192.168.1.0/24"
    #   target_type: network_range
    #   interval_s: 21600
    #   priority: 3

    # Example: Code audit daily
    # - objective: "Security audit of main application codebase"
    #   target: "/opt/app/src"
    #   target_type: code_repo
    #   interval_s: 86400
    #   priority: 5

# ── Dashboard ───────────────────────────────────────────────────────
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  auth_enabled: true
  username: admin
  password: changeme  # CHANGE THIS!

# ── Docker Sandbox ──────────────────────────────────────────────────
docker:
  enabled: true
  image: recursec/kali-tools:latest
  network_mode: host
  memory_limit: 4g
  cpu_limit: 2.0
  auto_build: true

# ── Tools ───────────────────────────────────────────────────────────
tools:
  sandbox_mode: true    # Run tools in Docker sandbox
  auto_install: false   # Auto-install missing tools on startup
  
  # Add your own custom tools
  custom_tools: []
    # - name: my-custom-scanner
    #   binary: my-scanner
    #   category: vuln_scan
    #   description: "My custom vulnerability scanner"
    #   install: "pip install my-scanner"
  
  # Disable specific tools
  disabled_tools: []
    # - metasploit
    # - beef

# ── Memory / Database ──────────────────────────────────────────────
db_path: /data/recursec_memory.db
data_dir: /data

# ── Logging ─────────────────────────────────────────────────────────
log_level: INFO
# log_file: /data/recursec.log  # Uncomment to log to file
