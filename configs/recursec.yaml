# ╔══════════════════════════════════════════════════════════════════╗
# ║              RecurSec Configuration                              ║
# ║  Configured for YOUR 16 GGUF models via llama.cpp               ║
# ║  Run: ./scripts/launch_models.sh to start all servers            ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── YOUR 16 LLM MODELS ─────────────────────────────────────────────
# Each model is served by llama.cpp on a separate port (8100-8115)
# Models are assigned to task types based on their strengths

models:
  # ═══════════════════════════════════════════════════════════
  # PRIMARY SECURITY BRAIN
  # WhiteRabbitNeo — trained specifically for hacking/security
  # This model gets ALL security-related tasks first
  # ═══════════════════════════════════════════════════════════
  - name: whiterabbitneo-security
    backend: llama_cpp
    model_id: WhiteRabbitNeo-7B-v1.5a
    base_url: http://localhost:8100
    task_types: [security, exploit, vuln_analysis, pentest]
    priority: 1
    max_concurrent: 4
    weight: 2.0  # Double weight — prefer for security tasks

  # ═══════════════════════════════════════════════════════════
  # CODE ANALYSIS MODELS
  # For source code review, exploit development, code auditing
  # ═══════════════════════════════════════════════════════════
  - name: qwen-coder-14b
    backend: llama_cpp
    model_id: Qwen2.5-Coder-14B-Instruct
    base_url: http://localhost:8101
    task_types: [code, code_audit, exploit_dev]
    priority: 1
    max_concurrent: 4
    weight: 1.5  # Largest code model

  - name: qwen-coder-7b
    backend: llama_cpp
    model_id: Qwen2.5-Coder-7B-Instruct
    base_url: http://localhost:8102
    task_types: [code, code_audit, security]
    priority: 2
    max_concurrent: 4
    weight: 1.0

  - name: codellama-13b
    backend: llama_cpp
    model_id: codellama-13b-instruct
    base_url: http://localhost:8103
    task_types: [code, exploit_dev]
    priority: 2
    max_concurrent: 4
    weight: 1.0

  - name: codellama-7b
    backend: llama_cpp
    model_id: codellama-7b
    base_url: http://localhost:8104
    task_types: [code, fast]
    priority: 4
    max_concurrent: 4
    weight: 0.7

  # ═══════════════════════════════════════════════════════════
  # REASONING MODELS
  # For planning, decision-making, complex analysis
  # ═══════════════════════════════════════════════════════════
  - name: deepseek-r1-reasoning
    backend: llama_cpp
    model_id: DeepSeek-R1-Distill-Qwen-7B
    base_url: http://localhost:8105
    task_types: [reasoning, planning, analysis]
    priority: 1
    max_concurrent: 4
    weight: 1.5  # Best for chain-of-thought

  - name: deepseek-math
    backend: llama_cpp
    model_id: deepseek-math-7b-instruct
    base_url: http://localhost:8106
    task_types: [reasoning, crypto, math]
    priority: 2
    max_concurrent: 4
    weight: 1.0

  # ═══════════════════════════════════════════════════════════
  # GENERAL PURPOSE MODELS
  # For recon, OSINT, report writing, general tasks
  # ═══════════════════════════════════════════════════════════
  - name: hermes-14b
    backend: llama_cpp
    model_id: Hermes-4-14B
    base_url: http://localhost:8107
    task_types: [general, writing, report, analysis]
    priority: 1
    max_concurrent: 4
    weight: 1.5  # Largest general model

  - name: llama-3.1-8b
    backend: llama_cpp
    model_id: Meta-Llama-3.1-8B-Instruct
    base_url: http://localhost:8108
    task_types: [general, recon, osint]
    priority: 2
    max_concurrent: 4
    weight: 1.0

  - name: dolphin-uncensored
    backend: llama_cpp
    model_id: dolphin-2.9-llama3-8b
    base_url: http://localhost:8109
    task_types: [general, security, exploit, pentest]
    priority: 2
    max_concurrent: 4
    weight: 1.2  # Uncensored — useful for security tasks

  - name: mistral-7b
    backend: llama_cpp
    model_id: Mistral-7B-Instruct-v0.3
    base_url: http://localhost:8110
    task_types: [general, fast, recon]
    priority: 3
    max_concurrent: 4
    weight: 0.8

  # ═══════════════════════════════════════════════════════════
  # LONG CONTEXT — Yi-9B-200K (200,000 token context!)
  # For analyzing large codebases, long reports, full logs
  # ═══════════════════════════════════════════════════════════
  - name: yi-200k-longctx
    backend: llama_cpp
    model_id: Yi-9B-200K
    base_url: http://localhost:8111
    task_types: [long_context, code_audit, report, analysis]
    priority: 1
    max_concurrent: 2  # Lower due to large context
    weight: 1.0

  # ═══════════════════════════════════════════════════════════
  # FAST / SMALL — Phi-3.5-mini (2.4GB, ultra-fast)
  # For quick classifications, simple queries, triage
  # ═══════════════════════════════════════════════════════════
  - name: phi-fast
    backend: llama_cpp
    model_id: Phi-3.5-mini-instruct
    base_url: http://localhost:8112
    task_types: [fast, triage, classification]
    priority: 1
    max_concurrent: 8
    weight: 1.0

  # ═══════════════════════════════════════════════════════════
  # FUNCTION CALLING — FunctionGemma-270m (542MB, instant)
  # Ultra-fast tool call routing, decides which tool to use
  # ═══════════════════════════════════════════════════════════
  - name: functiongemma-router
    backend: llama_cpp
    model_id: functiongemma-270m-it
    base_url: http://localhost:8113
    task_types: [function_call, tool_routing, fast]
    priority: 1
    max_concurrent: 16
    weight: 1.0

  # ═══════════════════════════════════════════════════════════
  # SAFETY GUARD — Llama-Guard-3 (955MB)
  # Filters unsafe content, ensures authorized testing only
  # ═══════════════════════════════════════════════════════════
  # NOTE: This model is used by the SafetyGuard system, not
  # directly by agents. See safety section below.

  # ═══════════════════════════════════════════════════════════
  # EMBEDDING — Nomic-Embed-Text (548MB)
  # Converts text to vectors for semantic search (RAG)
  # ═══════════════════════════════════════════════════════════
  # NOTE: This model is used by the EmbeddingClient, not
  # directly by agents. See memory section below.

# ── Agent Settings ──────────────────────────────────────────────
agent:
  max_steps: 50          # Max steps per agent
  max_depth: 5           # Max recursion depth
  temperature: 0.3       # LLM temperature
  max_tokens: 4096       # Max response tokens
  human_approval_required: false

# ── Safety Guard ────────────────────────────────────────────────
safety:
  enabled: true
  base_url: http://localhost:8114  # Llama-Guard-3
  authorization_scope: ""           # Set to your engagement scope

# ── Embedding / RAG ────────────────────────────────────────────
embedding:
  enabled: true
  base_url: http://localhost:8115  # Nomic-Embed-Text
  model_id: nomic-embed-text

# ── Daemon Mode (24/7) ─────────────────────────────────────────
daemon:
  enabled: true
  poll_interval_s: 60
  max_concurrent_tasks: 5
  auto_restart: true
  schedule: []

# ── Dashboard ──────────────────────────────────────────────────
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  auth_enabled: true
  username: admin
  password: changeme

# ── Docker Sandbox ─────────────────────────────────────────────
docker:
  enabled: false         # Set true if you want sandboxed tool execution
  image: recursec/kali-tools:latest
  network_mode: host
  memory_limit: 4g
  cpu_limit: 2.0
  auto_build: true

# ── Tools ──────────────────────────────────────────────────────
tools:
  sandbox_mode: false    # Set true for Docker sandboxing
  auto_install: false    # Set true to auto-install missing tools
  custom_tools: []
  disabled_tools: []

# ── Memory / Database ──────────────────────────────────────────
db_path: ./data/recursec_memory.db
data_dir: ./data

# ── Logging ────────────────────────────────────────────────────
log_level: INFO
