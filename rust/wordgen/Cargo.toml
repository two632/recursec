[package]
name = "recursec-wordgen"
version = "0.1.0"
edition = "2021"
description = "RecurSec wordlist and password generator"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "wordgen"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
