[package]
name = "recursec-scanner"
version = "0.1.0"
edition = "2021"
description = "RecurSec async TCP port scanner with service detection"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "scanner"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
